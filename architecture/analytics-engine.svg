<text x="55" y="58" class="label" fill="#765a12">AI-POWERED SMART GRID ENERGY INTELLIGENCE ASSISTANT</text>
<text x="55" y="112" class="title ink">Analytics and AI Engine - Technical Detail</text>
<text x="55" y="151" class="subtitle muted">The four modules share date-scoped hourly data. Branch steps and limits below follow the Python implementation.</text>
<text x="2645" y="58" text-anchor="end" class="small muted">2 / 3  ANALYTICS ENGINE</text>
