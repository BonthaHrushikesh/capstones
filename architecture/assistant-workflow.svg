<text x="66" y="235" class="label" text-anchor="start" fill="#23606b">API / APPLICATION LAYER</text>
<rect x="68" y="275" width="355" height="205" rx="13" fill="#edf7fa" stroke="#5d9eab" stroke-width="2"/>
<text x="89" y="309" class="card-title" text-anchor="start" fill="#23606b">Request path</text>
<text x="89" y="345" class="body muted" text-anchor="start">GET focused analytics endpoints</text>
<text x="89" y="371" class="body muted" text-anchor="start">POST /api/ask(question, dates,</text>
<text x="89" y="397" class="body muted" text-anchor="start">context)</text>
<text x="89" y="423" class="body muted" text-anchor="start">Validate request length and date</text>
<text x="89" y="449" class="body muted" text-anchor="start">parameters</text>
<text x="89" y="475" class="body muted" text-anchor="start">Apply topic, date and context</text>
<text x="89" y="501" class="body muted" text-anchor="start">guardrails</text>
<text x="89" y="527" class="body muted" text-anchor="start">Map data errors to HTTP</text>
<text x="89" y="553" class="body muted" text-anchor="start">responses</text>
<rect x="448" y="275" width="375" height="205" rx="13" fill="#edf7fa" stroke="#5d9eab" stroke-width="2"/>
<text x="469" y="309" class="card-title" text-anchor="start" fill="#23606b">Response shape</text>
<text x="469" y="345" class="body muted" text-anchor="start">Endpoint-specific JSON metrics</text>
<text x="469" y="371" class="body muted" text-anchor="start">Copilot: answer + evidence + trace</text>
<text x="469" y="397" class="body muted" text-anchor="start">NLP interpretation + search</text>
<text x="469" y="423" class="body muted" text-anchor="start">results</text>
<text x="469" y="449" class="body muted" text-anchor="start">Forecast model and caveats</text>
<text x="469" y="475" class="body muted" text-anchor="start">No results database; results</text>
<text x="469" y="501" class="body muted" text-anchor="start">returned to caller</text>
<rect x="68" y="510" width="755" height="185" rx="13" fill="#edf7fa" stroke="#5d9eab" stroke-width="2"/>
<text x="89" y="544" class="card-title" text-anchor="start" fill="#23606b">Important routes</text>
<text x="89" y="580" class="body muted" text-anchor="start">GET /api/summary, /trends, /anomalies, /forecast, /evaluation</text>
<text x="89" y="606" class="body muted" text-anchor="start">GET /api/data-quality, /search, /agents/insight, /agents/decision</text>
<text x="89" y="632" class="body muted" text-anchor="start">POST /api/ask; FastAPI also serves the built React app</text>
<rect x="885" y="200" width="835" height="540" rx="18" fill="#ffffff" stroke="#d7dce4" stroke-width="2"/>
<rect x="885" y="200" width="835" height="52" rx="16" fill="#f4f0ff" stroke="#f4f0ff" stroke-width="0"/>
<rect x="885" y="240" width="835" height="12" rx="0" fill="#f4f0ff" stroke="#f4f0ff" stroke-width="0"/>
