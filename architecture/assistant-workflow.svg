<text x="1776" y="235" class="label" text-anchor="start" fill="#296b4f">FRONTEND / PRESENTATION LAYER</text>
<rect x="1778" y="275" width="420" height="205" rx="13" fill="#eef7f2" stroke="#68a388" stroke-width="2"/>
<text x="1799" y="309" class="card-title" text-anchor="start" fill="#296b4f">Dashboard sections</text>
<text x="1799" y="345" class="body muted" text-anchor="start">Overview: average, max, total energy,</text>
<text x="1799" y="371" class="body muted" text-anchor="start">P95</text>
<text x="1799" y="397" class="body muted" text-anchor="start">Analytics: demand, daily/monthly, peak</text>
<text x="1799" y="423" class="body muted" text-anchor="start">hours</text>
<text x="1799" y="449" class="body muted" text-anchor="start">Anomalies: time, observed, baseline,</text>
<text x="1799" y="475" class="body muted" text-anchor="start">score</text>
<text x="1799" y="501" class="body muted" text-anchor="start">Forecast: history, values, model,</text>
<text x="1799" y="527" class="body muted" text-anchor="start">caveat</text>
<rect x="2218" y="275" width="414" height="205" rx="13" fill="#eef7f2" stroke="#68a388" stroke-width="2"/>
<text x="2239" y="309" class="card-title" text-anchor="start" fill="#296b4f">More dashboard sections</text>
<text x="2239" y="345" class="body muted" text-anchor="start">Data Quality: records, missing,</text>
<text x="2239" y="371" class="body muted" text-anchor="start">duplicates, rate</text>
<text x="2239" y="397" class="body muted" text-anchor="start">AI Chat: question, answer, evidence,</text>
<text x="2239" y="423" class="body muted" text-anchor="start">rating</text>
<text x="2239" y="449" class="body muted" text-anchor="start">Insights, reports and CSV export</text>
<text x="2239" y="475" class="body muted" text-anchor="start">Date scope passed to backend endpoints</text>
<rect x="1778" y="510" width="854" height="185" rx="13" fill="#eef7f2" stroke="#68a388" stroke-width="2"/>
<text x="1799" y="544" class="card-title" text-anchor="start" fill="#296b4f">How results are shown</text>
<text x="1799" y="580" class="body muted" text-anchor="start">React pages call the JSON API through services/api.ts</text>
<text x="1799" y="606" class="body muted" text-anchor="start">Charts, tables, metrics and evidence panels render returned values</text>
<text x="1799" y="632" class="body muted" text-anchor="start">Chat evaluation and feedback are saved in browser localStorage</text>
