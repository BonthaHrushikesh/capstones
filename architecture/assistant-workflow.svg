<text x="913" y="235" class="label" text-anchor="start" fill="#5b438f">AI ENERGY INTELLIGENCE ASSISTANT</text>
<rect x="915" y="275" width="775" height="245" rx="13" fill="#f4f0ff" stroke="#8d78c6" stroke-width="2"/>
<text x="936" y="309" class="card-title" text-anchor="start" fill="#5b438f">Question understanding</text>
<text x="936" y="345" class="body muted" text-anchor="start">Rule-based token normalization, synonyms, intents and parameter extraction</text>
<text x="936" y="371" class="body muted" text-anchor="start">Supported focus: date scope, sub-meter, measurement, weekday, forecast</text>
<text x="936" y="397" class="body muted" text-anchor="start">horizon</text>
<text x="936" y="423" class="body muted" text-anchor="start">Guardrails ask for clarification when the dataset cannot answer the request</text>
<text x="936" y="449" class="body muted" text-anchor="start">Example: &quot;What were the peak demand hours?&quot;</text>
<text x="936" y="475" class="body muted" text-anchor="start">Example: &quot;Did anything unusual happen yesterday?&quot;</text>
<text x="936" y="501" class="body muted" text-anchor="start">Example: &quot;What is the expected demand for the next 24 hours?&quot;</text>
<text x="936" y="527" class="body muted" text-anchor="start">Example: &quot;How much energy was consumed this month?&quot;</text>
<rect x="915" y="545" width="370" height="155" rx="13" fill="#fff7e7" stroke="#c89c38" stroke-width="2"/>
<text x="936" y="579" class="card-title" text-anchor="start" fill="#81600d">Evidence-first answer</text>
<text x="936" y="615" class="body muted" text-anchor="start">Call only the requested</text>
<text x="936" y="641" class="body muted" text-anchor="start">calculations; rank keyword</text>
<text x="936" y="667" class="body muted" text-anchor="start">evidence; compose facts + limits +</text>
<text x="936" y="693" class="body muted" text-anchor="start">trace</text>
<rect x="1300" y="545" width="390" height="155" rx="13" fill="#f4f0ff" stroke="#8d78c6" stroke-width="2"/>
<text x="1321" y="579" class="card-title" text-anchor="start" fill="#5b438f">Optional language model</text>
<text x="1321" y="615" class="body muted" text-anchor="start">No key = local answer; configured</text>
<text x="1321" y="641" class="body muted" text-anchor="start">model may rephrase; unsupported</text>
<text x="1321" y="667" class="body muted" text-anchor="start">numbers are rejected</text>
<rect x="1748" y="200" width="914" height="540" rx="18" fill="#ffffff" stroke="#d7dce4" stroke-width="2"/>
<rect x="1748" y="200" width="914" height="52" rx="16" fill="#eef7f2" stroke="#eef7f2" stroke-width="0"/>
