<rect class="canvas" width="2700" height="1600"/>
<text x="55" y="58" class="label" fill="#765a12">AI-POWERED SMART GRID ENERGY INTELLIGENCE ASSISTANT</text>
<text x="55" y="112" class="title ink">API, Assistant and Dashboard Workflow</text>
<text x="55" y="151" class="subtitle muted">A request enters FastAPI, the Copilot selects supported local evidence, and React displays structured results.</text>
<text x="2645" y="58" text-anchor="end" class="small muted">3 / 3  REQUEST AND USER FLOW</text>
<rect x="38" y="200" width="820" height="540" rx="18" fill="#ffffff" stroke="#d7dce4" stroke-width="2"/>
<rect x="38" y="200" width="820" height="52" rx="16" fill="#edf7fa" stroke="#edf7fa" stroke-width="0"/>
<rect x="38" y="240" width="820" height="12" rx="0" fill="#edf7fa" stroke="#edf7fa" stroke-width="0"/>
